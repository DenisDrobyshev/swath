[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swath"
version = "0.1.0"
description = "Semantic segmentation of aerial and satellite imagery, from training to a georeferenced web service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Denis Drobyshev" }]
keywords = [
    "semantic-segmentation",
    "remote-sensing",
    "satellite-imagery",
    "aerial-imagery",
    "land-cover",
    "deep-learning",
    "unet",
    "geospatial",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pillow>=10.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
service = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "ruff>=0.15,<0.16", "httpx>=0.27"]
all = ["swath[geo,service,dev]"]

[project.urls]
Homepage = "https://github.com/DenisDrobyshev/swath"
Repository = "https://github.com/DenisDrobyshev/swath"
Issues = "https://github.com/DenisDrobyshev/swath/issues"

[project.scripts]
swath = "swath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swath = ["service/static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# An editable install leaves generated modules in the working tree; they are not
# ours to format and CI fails on them if they are in scope.
extend-exclude = ["build", "dist", ".venv", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
